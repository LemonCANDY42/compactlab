[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "compactlab"
version = "0.1.0"
description = "Replay your agent-session history and find the best auto-compact threshold per model and role."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
compactlab = "compactlab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/compactlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
