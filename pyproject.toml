[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "compactlab"
version = "0.1.0"
description = "Measure where to auto-compact from your own agent history: cost vs context-rot trade-offs per model and role."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "compactlab contributors" }]
keywords = ["claude-code", "codex", "context-window", "auto-compact", "llm-cost", "token-usage"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "pre-commit>=3"]

[project.urls]
Documentation = "https://github.com/LemonCANDY42/compactlab#readme"
Issues = "https://github.com/LemonCANDY42/compactlab/issues"
Changelog = "https://github.com/LemonCANDY42/compactlab/blob/main/CHANGELOG.md"

[project.scripts]
compactlab = "compactlab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/compactlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["compactlab"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E702", "RUF001", "RUF002", "RUF003", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"tests/test_report_dom.py" = ["B011", "E501"]  # the in-browser check script is one JS string

[tool.mypy]
python_version = "3.11"
files = ["src/compactlab"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = false
