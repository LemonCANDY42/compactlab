<text x="20" y="64" fill="#8b93ff" style="animation-delay:0.40s">$ uvx compactlab demo</text><text x="20" y="86" fill="#e6e8eb" style="animation-delay:1.58s">mode: lite</text><text x="20" y="108" fill="#e6e8eb" style="animation-delay:1.76s">model                  role     sess  turns  standard  headroom   +cost  -compact  recall</text><text x="20" y="130" fill="#e6e8eb" style="animation-delay:1.94s">claude-opus-5-5        main        6   1464      175k      300k    9.4%        40   0.925</text><text x="20" y="152" fill="#e6e8eb" style="animation-delay:2.12s">claude-opus-5-5        subagent    3    134      200k      350k    4.1%         3   0.948</text><text x="20" y="174" fill="#e6e8eb" style="animation-delay:2.30s">claude-sonnet-5-5      main        6   1137      175k      250k    9.4%        24   0.923</text><text x="20" y="196" fill="#e6e8eb" style="animation-delay:2.48s">claude-sonnet-5-5      subagent    3    137      225k      375k   11.8%         1   0.945</text><text x="20" y="218" fill="#e6e8eb" style="animation-delay:2.66s">gpt-5-codex            main        6    737      175k      250k    9.2%        12   0.929</text><text x="20" y="240" fill="#e6e8eb" style="animation-delay:2.84s">headroom (default) trades a bounded extra cost for fewer compactions; recall is an assumed proxy in lite mode.</text><text x="20" y="262" fill="#5eead4" style="animation-delay:3.02s">SYNTHETIC DEMO DATA (not your history). Report: compactlab-demo/report.html</text>
