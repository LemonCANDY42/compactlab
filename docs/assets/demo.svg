le="animation-delay:3.56s">  · cost: below 25% of the max window; expect frequent lossy compactions</text><text x="20" y="350" fill="#e6e8eb" style="animation-delay:3.74s">  · time: guardrail moved the pick from 325k to 650k</text><text x="20" y="372" fill="#e6e8eb" style="animation-delay:3.92s">  ...</text><text x="20" y="394" fill="#e6e8eb" style="animation-delay:4.10s">Profile shown first is selected (--profile, default balanced). Δ vs the harness default. Costs are list-price estimates; recall is an assumed proxy in lite mode.</text><text x="20" y="416" fill="#5eead4" style="animation-delay:4.28s">SYNTHETIC DEMO DATA (not your history). Report: compactlab-demo/report.html</text>
