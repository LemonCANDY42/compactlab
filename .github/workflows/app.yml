name: App
on:
  push:
    branches: [main]
    paths: ["app/**", "src/**", "tests/contract/**", "pyproject.toml", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", "src/**", "tests/contract/**", "pyproject.toml", ".github/workflows/app.yml"]
  release:
    types: [published] # attach the notarized disk image to the release
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write # release uploads only; nothing else writes
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the build number is the commit count
      - uses: astral-sh/setup-uv@v7
      - run: swift --version
      - name: Install the engine from this commit
        run: uv tool install .
      - name: Every interface string has a translation
        run: python3 app/scripts/check_strings.py
      - name: Unit tests (contract fixtures, fake engines, the real engine end to end)
        working-directory: app
        run: COMPACTLAB_TEST_ENGINE="$(uv tool dir --bin)/compactlab" swift test
      - name: Import the Developer ID certificate
        id: cert
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          if [ -z "$CERT_P12" ]; then echo "no certificate: the app is signed ad hoc"; exit 0; fi
          kc="$RUNNER_TEMP/signing.keychain-db"
          pw="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          identity="$(security find-identity -v -p codesigning "$kc" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
      - name: Package (universal)
        env:
          CODESIGN_IDENTITY: ${{ steps.cert.outputs.identity }}
        run: app/scripts/package_app.sh --universal
      - name: Smoke test (empty home, real engine)
        run: |
          engine="$(uv tool dir --bin)/compactlab"
          home="$(mktemp -d)"
          HOME="$home" COMPACTLAB_ENGINE="$engine" \
            app/build/compactlab.app/Contents/MacOS/compactlab --render-panel "$RUNNER_TEMP/panel-empty.png" --wait 30
      - name: Smoke test (demo logs, a calibration, both languages)
        run: |
          engine="$(uv tool dir --bin)/compactlab"
          home="$(mktemp -d)"
          "$engine" demo --out "$RUNNER_TEMP/demo" --no-open >/dev/null
          cp -R "$RUNNER_TEMP/demo/claude" "$home/.claude"
          cp -R "$RUNNER_TEMP/demo/codex" "$home/.codex"
          printf '{\n  "theme": "dark"\n}\n' > "$home/.claude/settings.json"  # no threshold set: something to suggest
          HOME="$home" "$engine" engine calibrate --since-days 0 --offline-pricing --reason ci >/dev/null
          for lang in en zh-Hans; do
            HOME="$home" COMPACTLAB_ENGINE="$engine" \
              app/build/compactlab.app/Contents/MacOS/compactlab --render-panel "$RUNNER_TEMP/panel-$lang.png" \
              --render-review "$RUNNER_TEMP/review-$lang.png" --wait 30 -AppleLanguages "($lang)" \
              | tee "$RUNNER_TEMP/diag-$lang.txt"
            grep -q "result: loaded" "$RUNNER_TEMP/diag-$lang.txt"
            grep -q "^settings: writable, [1-9]" "$RUNNER_TEMP/diag-$lang.txt"
          done
      - name: Notarize the app, then the disk image
        if: ${{ steps.cert.outputs.identity != '' }}
        env:
          CODESIGN_IDENTITY: ${{ steps.cert.outputs.identity }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          export NOTARY_KEY="$RUNNER_TEMP/notary.p8"
          app/scripts/notarize.sh app/build/compactlab.app
          dmg="$(app/scripts/make_dmg.sh app/build/compactlab.app)"
          app/scripts/notarize.sh "$dmg"
          app/scripts/cask.sh "$dmg" > app/build/compactlab-app.rb
          rm "$RUNNER_TEMP/notary.p8"
      - name: Disk image (ad hoc)
        if: ${{ steps.cert.outputs.identity == '' }}
        run: |
          ditto -c -k --keepParent app/build/compactlab.app app/build/compactlab-app-adhoc.zip
          app/scripts/make_dmg.sh app/build/compactlab.app
      - name: Attach to the release
        if: ${{ github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.cert.outputs.identity != '' }}
        run: |
          if [ "$SIGNED" != "true" ]; then
            echo "::error::no Developer ID secrets: a release gets only a notarized disk image (see app/README.md)"
            exit 1
          fi
          gh release upload "${{ github.event.release.tag_name }}" app/build/compactlab-*.dmg app/build/compactlab-app.rb --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: compactlab-app
          path: |
            app/build/*.zip
            app/build/*.dmg
            app/build/compactlab-app.rb
            ${{ runner.temp }}/panel-*.png
            ${{ runner.temp }}/review-*.png
          if-no-files-found: error
