name: Publish
# Uploads the engine to PyPI with trusted publishing: no token is stored here. PyPI trusts this repository's
# `publish.yml` running in the `pypi` environment (pypi.org → compactlab → Publishing).
on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    paths: [pyproject.toml, .github/workflows/publish.yml]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - name: Check the distributions
        run: |
          uvx twine check --strict dist/*
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "${{ github.event_name }}" = release ] && [ "${{ github.event.release.tag_name }}" != "v$version" ]; then
            echo "::error::release ${{ github.event.release.tag_name }} does not match version $version"; exit 1
          fi
          # PyPI shows the README on its own: every link and image must be absolute.
          if unzip -p dist/*.whl '*/METADATA' | grep -nP '(\]\(|src=")(?!https?://|#|mailto:)'; then
            echo "::error::relative link in the PyPI description"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/compactlab
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
