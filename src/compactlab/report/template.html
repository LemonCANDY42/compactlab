<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>compactlab report</title>
<style>
:root{
 --bg:#f6f5f0;--bg2:#efede6;--card:#fdfcf9;--ink:#1f1e1b;--ink2:#56544d;--ink3:#77746c;--line:#e3e0d6;--line2:#cfcbbf;
 --acc:#c15f3c;--acc-soft:#c15f3c17;--good:#2f7a4f;--good-soft:#2f7a4f14;--amber:#a26412;--amber-soft:#a2641216;--bad:#b42318;--bad-soft:#b4231812;
 --serif:ui-serif,"New York","Iowan Old Style","Charter","Palatino Linotype",Georgia,"Songti SC","Noto Serif CJK SC",serif;
 --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,"PingFang SC","Hiragino Sans GB",sans-serif;
 --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
 --r:14px;--rs:10px
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
 --bg:#1a1915;--bg2:#211f1b;--card:#24221e;--ink:#ecebe4;--ink2:#bab7ad;--ink3:#8f8c83;--line:#35332d;--line2:#4a4740;
 --acc:#d97757;--acc-soft:#d9775722;--good:#6cc08e;--good-soft:#6cc08e1c;--amber:#e3a548;--amber-soft:#e3a5481c;--bad:#f2867a;--bad-soft:#f2867a1c}}
:root[data-theme=dark]{
 --bg:#1a1915;--bg2:#211f1b;--card:#24221e;--ink:#ecebe4;--ink2:#bab7ad;--ink3:#8f8c83;--line:#35332d;--line2:#4a4740;
 --acc:#d97757;--acc-soft:#d9775722;--good:#6cc08e;--good-soft:#6cc08e1c;--amber:#e3a548;--amber-soft:#e3a5481c;--bad:#f2867a;--bad-soft:#f2867a1c}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
td,.kpi .v,.tval,.chip,#tip{font-variant-numeric:tabular-nums}
code{font:12px var(--mono);background:var(--bg2);border:1px solid var(--line);border-radius:5px;padding:0 4px}
svg.ic{display:inline-block;width:16px;height:16px;flex:none;vertical-align:-3px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
/* ---------- sidebar ---------- */
.side{position:sticky;top:0;align-self:start;height:100vh;overflow:auto;border-right:1px solid var(--line);padding:22px 14px 18px;display:flex;flex-direction:column;gap:18px;background:var(--bg)}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px}
.brand svg.ic{width:24px;height:24px;stroke-width:1.4}
.wm{font:600 19px/1.1 var(--serif);letter-spacing:-.01em}
#tabs{display:flex;flex-direction:column;gap:2px}
.navh{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);padding:12px 10px 4px}
.navh:first-child{padding-top:0}
#tabs button{display:flex;flex-direction:column;align-items:flex-start;text-align:left;font:inherit;color:var(--ink2);background:transparent;border:1px solid transparent;border-radius:var(--rs);padding:7px 10px;cursor:pointer;min-height:44px;width:100%}
#tabs button .nm{font-size:13.5px;color:var(--ink);font-weight:500;overflow-wrap:anywhere}
#tabs button .rl{font-size:11.5px;color:var(--ink3)}
#tabs button:hover{background:var(--bg2)}
#tabs button[aria-selected=true]{background:var(--card);border-color:var(--line);box-shadow:inset 2px 0 0 var(--acc)}
.sidefoot{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap;padding:0 8px}
/* ---------- main ---------- */
main{min-width:0;padding:26px 36px 64px;max-width:1180px;width:100%}
.eyebrow{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
h1{font:500 30px/1.15 var(--serif);letter-spacing:-.015em;margin:2px 0 0;overflow-wrap:anywhere}
h1 .rl{color:var(--ink3)}
h2{font:500 20px/1.25 var(--serif);letter-spacing:-.01em;margin:40px 0 12px;display:flex;align-items:center;gap:6px}
h3{font:600 13px/1.35 var(--sans);margin:0 0 8px;display:flex;align-items:center;gap:6px}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin:12px 0 0;font-size:12.5px;color:var(--ink2);align-items:center}
.mi{display:inline-flex;align-items:center;gap:6px;min-height:28px}.mi .ic{color:var(--ink3)}.mi.warn,.mi.warn .ic{color:var(--amber)}
.badge{display:inline-block;font-size:11px;border:1px solid var(--acc);color:var(--acc);border-radius:999px;padding:0 8px}
.cap{font-size:11.5px;color:var(--ink3);line-height:1.4}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
/* info / warning icon buttons (tooltips) */
.ib{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;padding:0;border:0;border-radius:50%;background:transparent;color:var(--ink3);cursor:help;flex:none}
.ib:hover{color:var(--ink);background:var(--bg2)}
.ib.low{color:var(--amber)}.ib.bad{color:var(--bad)}.ib.ok{color:var(--good)}
/* segmented controls */
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px;max-width:100%}
.seg button{font:inherit;font-size:13px;color:var(--ink2);background:transparent;border:1px solid transparent;border-radius:9px;padding:4px 12px;cursor:pointer;white-space:nowrap;min-height:32px;display:inline-flex;align-items:center;gap:6px;transition:color .15s,background .15s,border-color .15s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);border-color:var(--line);box-shadow:0 1px 1px #0000000a;font-weight:600}
.seg.sm button{padding:3px 10px;font-size:12px;min-height:28px}
/* sticky control bar */
.bar{position:sticky;top:0;z-index:5;margin:18px -36px 0;padding:10px 36px 6px;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:saturate(1.2) blur(10px);backdrop-filter:saturate(1.2) blur(10px);border-bottom:1px solid var(--line)}
.gearrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
#flags{display:inline-flex;gap:2px;margin-left:auto;align-items:center}
.vot{font-size:11.5px;color:var(--ink3)}
.slider{display:grid;grid-template-columns:auto 1fr auto;align-items:start;gap:4px 14px;font-size:13px;color:var(--ink2);flex:1 1 100%;min-width:0}
.slider label{line-height:28px;display:inline-flex;align-items:center;height:28px}
.track{position:relative;min-width:0;padding-bottom:46px}
input[type=range]{width:100%;height:28px;margin:0;accent-color:var(--acc);cursor:pointer;touch-action:pan-y;background:transparent}
.tval{font:600 20px/28px var(--mono);color:var(--ink);min-width:60px;text-align:right}
.mk{position:absolute;transform:translateX(-50%);font:inherit;font-size:11px;line-height:1.2;white-space:nowrap;background:transparent;border:0;padding:4px 2px 2px;color:var(--ink3);cursor:pointer;min-height:18px;display:inline-flex;align-items:center;gap:3px}
.mk svg.ic{width:12px;height:12px;vertical-align:-2px}
.mk::before{content:"";position:absolute;left:50%;top:-4px;width:1px;height:7px;background:currentColor;transform:translateX(-50%)}
.mk.r1{top:26px}.mk.r2{top:50px;color:var(--ink2)}.mk.r2::before{height:5px;top:-2px}
.mk.l1{margin-top:14px}.mk.l2{margin-top:28px}.mk.er{transform:translateX(calc(-100% + 4px))}.mk.er::before{left:auto;right:3px}.mk.el{transform:translateX(-4px)}.mk.el::before{left:3px}
.mk.on{color:var(--acc);font-weight:600}.mk:hover{color:var(--ink)}
/* KPI cards */
#ctl{margin-top:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;min-width:0}
.kh{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2)}.kh .ic{color:var(--ink3)}
.kpi .v{font:500 26px/1.25 var(--mono);letter-spacing:-.02em;margin-top:6px}
.kr{display:flex;align-items:center;gap:8px;margin-top:6px;min-width:0;flex-wrap:wrap}
.good{color:var(--good)}.warn{color:var(--amber)}.bad{color:var(--bad)}
/* delta chips */
.chip{display:inline-flex;align-items:center;gap:4px;font:500 12px/1 var(--mono);border-radius:999px;padding:4px 8px;background:var(--bg2);color:var(--ink2);white-space:nowrap}
.chip svg.ic{width:13px;height:13px;vertical-align:0}
.chip.good{background:var(--good-soft);color:var(--good)}.chip.warn{background:var(--amber-soft);color:var(--amber)}.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip[tabindex]{cursor:help}
.act{font:11px var(--sans);border:1px solid var(--line2);color:var(--ink2);border-radius:999px;padding:1px 8px;white-space:nowrap}
.act.set{border-color:var(--acc);color:var(--acc)}
/* mini gauges */
.gauge{position:relative;height:6px;border-radius:3px;background:var(--bg2);flex:1 1 60px;min-width:50px}
.gauge i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--ink3)}
.gauge b{position:absolute;top:-3px;width:2px;height:12px;background:var(--amber);border-radius:1px}
.pc.sel .gauge i,.kpi .gauge i{background:var(--acc)}
/* profiles: per-day impact */
.ihead{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:12px}
.pcs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0;display:grid;gap:10px;align-content:start}
.pc.sel{border-color:color-mix(in srgb,var(--acc) 55%,var(--line));box-shadow:inset 0 2px 0 var(--acc)}
.pc header{display:flex;align-items:center;gap:7px;min-width:0}
.pc header>svg.ic{width:18px;height:18px;color:var(--ink2)}.pc.sel header>.ic{color:var(--acc)}
.pc .pn{font:500 17px/1.2 var(--serif)}
.pc .act{margin-left:auto}
.tb{display:flex;align-items:center;gap:8px}.tb .pt{font:500 13px var(--mono);min-width:44px;text-align:right}
.irow{display:grid;gap:5px;padding-top:8px;border-top:1px solid var(--line)}
.irow .chips{display:flex;flex-wrap:wrap;gap:5px}
/* charts */
svg{width:100%;height:auto;display:block}
text{fill:var(--ink3);font-size:10.5px;font-family:var(--sans)}
.ax{stroke:var(--line2)}.grid{stroke:var(--line);stroke-dasharray:1 3}
.dl{font-size:10.5px;paint-order:stroke;stroke:var(--card);stroke-width:3px;stroke-linejoin:round}
.hov{cursor:crosshair}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--card);color:var(--ink);border:1px solid var(--line2);border-radius:10px;padding:8px 11px;font-size:12px;line-height:1.5;box-shadow:0 8px 28px #00000014;min-width:150px;max-width:min(340px,calc(100vw - 16px))}
#tip b{font:600 13px var(--mono)}#tip .r{display:flex;justify-content:space-between;gap:16px}#tip .r span:first-child{color:var(--ink2)}#tip .r span:last-child{font-family:var(--mono)}
/* tables */
select,input[type=search]{font:inherit;font-size:13px;background:var(--card);color:var(--ink);border:1px solid var(--line2);border-radius:9px;padding:6px 10px;min-height:34px;max-width:100%}
input[type=search]{width:260px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--ink3);font-weight:500;font-size:11.5px}
#st th[data-k]{cursor:pointer}
.scroll{overflow:auto;max-height:440px}
#fCmp{max-height:none}#fCmp th{white-space:normal;vertical-align:bottom}#fCmp th,#fCmp td{padding:7px 6px}
#fCmp td{font-family:var(--mono);font-size:12px}#fCmp td:first-child{font-family:var(--sans)}
tr.sel td{background:var(--acc-soft)}tr.sel td:first-child{box-shadow:inset 2px 0 0 var(--acc);font-weight:600}
.ctlrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
pre.snip{background:var(--bg2);border:1px solid var(--line);border-radius:var(--rs);padding:12px 14px;overflow:auto;font:12px/1.55 var(--mono);white-space:pre;max-height:420px;margin:12px 0 0}
.copyrow{display:flex;gap:8px 10px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-size:13px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:9px;padding:5px 14px;cursor:pointer;min-height:32px}
details.more{margin-top:40px;font-size:12.5px;color:var(--ink2)}details.more summary{cursor:pointer;min-height:32px;display:flex;align-items:center;gap:6px;color:var(--ink2)}
ul.n{margin:6px 0 0;padding-left:18px}ul.n li{margin:3px 0}
.foot{margin-top:28px;padding-top:12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink3);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
/* ---------- responsive ---------- */
@media (max-width:1100px){.pcs{grid-template-columns:1fr 1fr}}
@media (max-width:900px){
 .app{display:block}
 .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px 16px 10px;gap:10px;display:grid;grid-template-columns:1fr auto;align-items:center}
 .brand{padding:0}.sidefoot{margin:0;padding:0}
 #tabs{grid-column:1/-1;flex-direction:row;flex-wrap:nowrap;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}.navh{display:none}
 #tabs button{flex:none;white-space:nowrap;width:auto;border:1px solid var(--line);border-radius:999px;padding:5px 12px;flex-direction:row;gap:6px;align-items:baseline}
 #tabs button[aria-selected=true]{box-shadow:none;border-color:var(--ink)}
 main{padding:20px 16px 56px}
 .bar{margin:16px -16px 0;padding:8px 16px 4px}
 .grid2{grid-template-columns:1fr}
 h1{font-size:26px}
}
@media (max-width:768px),(pointer:coarse){.seg button,.btn,#tabs button{min-height:44px}.seg.sm button{min-height:40px}.ib{width:44px;height:44px}.mk{min-height:24px}input[type=range]{height:44px}.mk.r1{top:38px}.mk.r2{top:64px}.track{padding-bottom:62px}.slider label,.tval{line-height:44px;height:44px}}
@media (max-width:640px){.pcs{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.kpi .v{font-size:21px}}
@media (max-width:520px){
 #gears{display:grid;grid-template-columns:repeat(4,1fr);flex:1 1 100%}
 #gears button{padding:4px;justify-content:center;font-size:12.5px}#gears .gt{display:none}
 .slider{grid-template-columns:1fr auto;width:100%}.slider label{grid-row:1}.tval{grid-row:1;grid-column:2}.track{grid-column:1/-1}
 #flags{margin-left:0}.card{padding:14px}
}
@media (max-width:380px){.kpis{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style></head><body>

<div class="app">
<aside class="side" id="side">
 <div class="brand"><svg class="ic" aria-hidden="true"><use href="#i-logo"/></svg><span class="wm">compactlab</span></div>
 <nav id="tabs" role="tablist" aria-label="Groups"></nav>
 <div class="sidefoot"><div class="seg sm" role="group" aria-label="Language" id="langs"></div><div class="seg sm" role="group" aria-label="Theme" id="themes"></div></div>
</aside>
<main id="main">
 <header>
  <div class="eyebrow" id="eyebrow"></div>
  <h1 id="title">compactlab</h1>
  <div class="meta" id="meta"></div>
 </header>
 <div class="bar" id="bar"></div>
 <section id="ctl"><div class="kpis" id="kpis"></div></section>
 <h2><span id="hImpact"></span><span id="iImpact"></span></h2>
 <div id="fImpact"></div>
 <h2><span id="hCmp"></span><span id="iCmp"></span></h2>
 <div class="card scroll" id="fCmp"></div>
 <h2><span id="hCopy"></span><span id="iCopy"></span></h2>
 <div class="card" id="fCopy"></div>
 <h2><span id="hTrade"></span></h2>
 <div class="grid2"><div class="card fig" id="fPareto"></div><div class="card fig" id="fCost"></div></div>
 <h2><span id="hTime"></span></h2>
 <div class="card fig" id="fTime"></div>
 <h2><span id="hHist"></span></h2>
 <div class="grid2"><div class="card fig" id="fHist"></div><div class="card fig" id="fSess"></div></div>
 <h2><span id="hDeep"></span></h2>
 <div class="card" id="fDeep"></div>
 <h2><span id="hSess"></span></h2>
 <div class="ctlrow"><input type="search" id="q"> <span class="cap" id="cnt"></span></div>
 <div class="card scroll"><table id="st"></table></div>
 <details class="more"><summary id="hNotes"></summary><ul class="n" id="notes"></ul></details>
 <footer class="foot" id="foot"></footer>
</main>
</div>
<div id="tip" role="tooltip" hidden></div>
<script id="data" type="application/json">__DATA__</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const $=s=>document.querySelector(s),NS='http://www.w3.org/2000/svg';
const fk=v=>v==null?'–':v>=1e6?(v/1e6)+'M':Math.round(v/1e3)+'k';
const MINUS='−';
const fd=v=>(v<0?MINUS:'')+'$'+(Math.abs(v)>=100?Math.round(Math.abs(v)).toLocaleString('en-US'):Math.abs(v).toFixed(2));

  $('#st').innerHTML='<tr>'+cols.map(c=>`<th data-k="${c[0]}">${t(c[1])}</th>`).join('')+'<th>'+t('colCtx')+'</th></tr>'+rows.slice(0,500).map(s=>`<tr><td>${esc(s.id.slice(0,28))}</td><td>${s.harness}</td><td>${s.role}</td><td>${esc(s.model)}</td><td>${s.turns}</td><td>${fk(s.peak)}</td><td>${s.compactions}</td><td>${spark(s.curve)}</td></tr>`).join('');
  document.querySelectorAll('#st th[data-k]').forEach(th=>th.onclick=()=>{const k=th.dataset.k;asc=sortK===k?!asc:false;sortK=k;renderS()})}
$('#q').oninput=renderS;renderS();
</script></body></html>
