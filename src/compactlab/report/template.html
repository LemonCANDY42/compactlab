<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>compactlab report</title>
<style>
:root{
 --bg:#f6f5f0;--bg2:#efede6;--card:#fdfcf9;--ink:#1f1e1b;--ink2:#56544d;--ink3:#77746c;--line:#e3e0d6;--line2:#cfcbbf;
 --acc:#c15f3c;--acc-soft:#c15f3c17;--good:#2f7a4f;--good-soft:#2f7a4f14;--amber:#a26412;--amber-soft:#a2641214;--bad:#b42318;--bad-soft:#b4231812;
 --serif:ui-serif,"New York","Iowan Old Style","Charter","Palatino Linotype",Georgia,"Songti SC","Noto Serif CJK SC",serif;
 --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,"PingFang SC","Hiragino Sans GB",sans-serif;
 --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
 --r:14px;--rs:10px
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
 --bg:#1a1915;--bg2:#211f1b;--card:#24221e;--ink:#ecebe4;--ink2:#bab7ad;--ink3:#8f8c83;--line:#35332d;--line2:#4a4740;
 --acc:#d97757;--acc-soft:#d9775722;--good:#6cc08e;--good-soft:#6cc08e1a;--amber:#e3a548;--amber-soft:#e3a5481a;--bad:#f2867a;--bad-soft:#f2867a1a}}
:root[data-theme=dark]{
 --bg:#1a1915;--bg2:#211f1b;--card:#24221e;--ink:#ecebe4;--ink2:#bab7ad;--ink3:#8f8c83;--line:#35332d;--line2:#4a4740;
 --acc:#d97757;--acc-soft:#d9775722;--good:#6cc08e;--good-soft:#6cc08e1a;--amber:#e3a548;--amber-soft:#e3a5481a;--bad:#f2867a;--bad-soft:#f2867a1a}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.num,.kpi .v,.tval,td,.it td,#tip{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
code{font:12px var(--mono);background:var(--bg2);border:1px solid var(--line);border-radius:5px;padding:0 4px}
b{font-weight:600}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
/* ---------- sidebar ---------- */
.side{position:sticky;top:0;align-self:start;height:100vh;overflow:auto;border-right:1px solid var(--line);padding:22px 14px 18px;display:flex;flex-direction:column;gap:20px;background:var(--bg)}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px}
.brand svg{width:26px;height:26px;flex:none;color:var(--ink)}
.wm{font:600 19px/1.1 var(--serif);letter-spacing:-.01em}
.tag{font-size:11.5px;color:var(--ink3);line-height:1.3;margin-top:2px}
#tabs{display:flex;flex-direction:column;gap:2px}
.navh{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);padding:12px 10px 4px}
.navh:first-child{padding-top:0}
#tabs button{display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left;font:inherit;color:var(--ink2);background:transparent;border:1px solid transparent;border-radius:var(--rs);padding:7px 10px;cursor:pointer;min-height:44px;width:100%}
#tabs button .nm{font-size:13.5px;color:var(--ink);font-weight:500;overflow-wrap:anywhere}
#tabs button .rl{font-size:11.5px;color:var(--ink3)}
#tabs button:hover{background:var(--bg2)}
#tabs button[aria-selected=true]{background:var(--card);border-color:var(--line);box-shadow:inset 2px 0 0 var(--acc)}
.sidefoot{margin-top:auto;display:grid;gap:8px;padding:0 8px}
.lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
/* ---------- main ---------- */
main{min-width:0;padding:28px 36px 72px;max-width:1180px;width:100%}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
h1{font:500 32px/1.15 var(--serif);letter-spacing:-.015em;margin:4px 0 0;overflow-wrap:anywhere}
h1 .rl{color:var(--ink3)}
h2{font:500 21px/1.25 var(--serif);letter-spacing:-.01em;margin:44px 0 4px}
h2+.sub{margin:0 0 14px;color:var(--ink2);font-size:13px;max-width:72ch}
h3{font:600 13.5px/1.35 var(--sans);margin:0 0 2px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px 24px;margin:18px 0 0;padding:14px 0 0;border-top:1px solid var(--line)}
.meta div{min-width:0}.meta dt{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}.meta dd{margin:2px 0 0;font-size:13px;color:var(--ink);overflow-wrap:anywhere}
.badge{display:inline-block;font-size:11px;border:1px solid var(--line2);border-radius:999px;padding:0 8px;color:var(--ink2);vertical-align:1px}
.badge.acc{border-color:var(--acc);color:var(--acc)}
details.note{margin:16px 0 0;font-size:13px;color:var(--ink2)}
details.note summary{cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;min-height:32px}
details.note p{max-width:80ch;margin:6px 0 0}
.mut{color:var(--ink2)}.zh{color:var(--ink3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.card>p{margin:0 0 10px;font-size:12.5px;color:var(--ink2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
/* segmented controls */
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px;max-width:100%}
.seg button{font:inherit;font-size:13px;color:var(--ink2);background:transparent;border:1px solid transparent;border-radius:9px;padding:5px 12px;cursor:pointer;white-space:nowrap;min-height:32px;transition:color .15s,background .15s,border-color .15s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);border-color:var(--line);box-shadow:0 1px 1px #0000000a;font-weight:600}
.seg.sm button{padding:3px 10px;font-size:12px;min-height:28px}
.meta{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
/* sticky control bar */
.bar{position:sticky;top:0;z-index:5;margin:22px -36px 0;padding:12px 36px 8px;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:saturate(1.2) blur(10px);backdrop-filter:saturate(1.2) blur(10px);border-bottom:1px solid var(--line)}
.gearrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.vot{font-size:12px;color:var(--ink3);margin-left:auto}
.slider{display:grid;grid-template-columns:auto 1fr auto;align-items:start;gap:4px 14px;font-size:13px;color:var(--ink2);flex:1 1 100%;min-width:0}
.slider label{white-space:nowrap;line-height:28px}
.track{position:relative;min-width:0;padding-bottom:46px}
input[type=range]{width:100%;height:28px;margin:0;accent-color:var(--acc);cursor:pointer;touch-action:pan-y;background:transparent}
.tval{font:600 20px/28px var(--mono);color:var(--ink);min-width:60px;text-align:right}
.mk{position:absolute;transform:translateX(-50%);font:inherit;font-size:11px;line-height:1.2;white-space:nowrap;background:transparent;border:0;padding:4px 2px 2px;color:var(--ink3);cursor:pointer;min-height:18px}
.mk::before{content:"";position:absolute;left:50%;top:-4px;width:1px;height:7px;background:currentColor;transform:translateX(-50%)}
.mk.r1{top:26px}.mk.r2{top:50px;color:var(--ink2)}.mk.r2::before{height:5px;top:-2px}
.mk.l1{margin-top:14px}.mk.l2{margin-top:28px}.mk.er{transform:translateX(calc(-100% + 4px))}.mk.er::before{left:auto;right:3px}.mk.el{transform:translateX(-4px)}.mk.el::before{left:3px}
.mk.on{color:var(--acc);font-weight:600}.mk:hover{color:var(--ink)}
.gl .z{color:inherit;opacity:.7}
/* KPI cards */
#ctl{margin-top:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 13px;min-width:0}
.kpi .k{font-size:12px;color:var(--ink2);line-height:1.35}
.kpi .v{font:500 27px/1.25 var(--mono);letter-spacing:-.02em;margin-top:6px}
.kpi .v small{font:400 12px var(--sans);color:var(--ink3);letter-spacing:0;margin-left:3px}
.kpi .d{font-size:12px;color:var(--ink3);margin-top:4px;line-height:1.45}
.good{color:var(--good)}.warn{color:var(--amber)}.bad{color:var(--bad)}
/* callouts */
#callouts{display:grid;gap:8px;margin-top:12px}
.callout{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--rs);padding:10px 14px}
.callout::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;margin-top:7px;background:var(--ink3)}
.callout.info::before{background:var(--good)}.callout.low::before{background:var(--amber)}.callout.bad{border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}.callout.bad::before{background:var(--bad)}
/* per-day impact */
.ihead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:12px}
.pcs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 12px;min-width:0}
.pc.sel{border-color:color-mix(in srgb,var(--acc) 55%,var(--line));box-shadow:inset 0 2px 0 var(--acc)}
.pc header{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.pc .pn{font:500 17px/1.2 var(--serif)}.pc .pt{font:500 13px var(--mono);color:var(--ink2)}
.chip{font-size:11px;border-radius:999px;padding:1px 8px;border:1px solid var(--line2);color:var(--ink2);margin-left:auto;white-space:nowrap}
.chip.set{border-color:var(--acc);color:var(--acc)}
.it{width:100%;border-collapse:collapse;font-size:12.5px}
.it th,.it td{padding:5px 0;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-weight:400}
.it th:first-child{text-align:left;color:var(--ink2);white-space:normal}
.it thead th{font-size:11px;color:var(--ink3);padding-top:0;vertical-align:bottom;white-space:normal;padding-left:8px}
.it td{font-family:var(--mono);font-size:13px;padding-left:8px}
.it tr.big td{font-size:15px;font-weight:500}
.it tr.sub th{padding-left:12px;font-size:11.5px;color:var(--ink3)}.it tr.sub td{font-size:12px;color:var(--ink2)}
.it tr:last-child th,.it tr:last-child td{border-bottom:0}
.it td .was{display:block;font:11px var(--sans);color:var(--ink3)}
.pc .fl{margin:8px 0 0;padding:0;list-style:none;font-size:11.5px;line-height:1.45}
.basis{font-size:12px;color:var(--ink2);margin:12px 0 0;max-width:90ch}
/* charts */
.fig h3{margin-bottom:2px}.fig>p{margin:0 0 10px}
svg{width:100%;height:auto;display:block}
text{fill:var(--ink3);font-size:10.5px;font-family:var(--sans)}
.ax{stroke:var(--line2)}.grid{stroke:var(--line);stroke-dasharray:1 3}
.dl{font-size:10.5px;paint-order:stroke;stroke:var(--card);stroke-width:3px;stroke-linejoin:round}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);margin-top:6px}.legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:5px}
.hov{cursor:crosshair}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--card);color:var(--ink);border:1px solid var(--line2);border-radius:10px;padding:8px 11px;font-size:12px;line-height:1.55;box-shadow:0 8px 28px #00000014;min-width:170px}
#tip b{font:600 13px var(--mono)}#tip .r{display:flex;justify-content:space-between;gap:16px}#tip .r span:first-child{color:var(--ink2)}#tip .r span:last-child{font-family:var(--mono)}
/* tables */
input[type=search]{width:280px}
select,input[type=search]{font:inherit;font-size:13px;background:var(--card);color:var(--ink);border:1px solid var(--line2);border-radius:9px;padding:6px 10px;min-height:34px;max-width:100%}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--ink3);font-weight:500;font-size:11.5px}
#st th[data-k]{cursor:pointer}
.scroll{overflow:auto;max-height:440px}
#fCmp{max-height:none}#fCmp th{white-space:normal;vertical-align:bottom}#fCmp td:last-child{white-space:normal;min-width:170px;font-size:11.5px}#fCmp th,#fCmp td{padding:7px 6px}
#fCmp td{font-family:var(--mono);font-size:12px}#fCmp td:first-child,#fCmp td.act{font-family:var(--sans)}
tr.sel td{background:var(--acc-soft)}tr.sel td:first-child{box-shadow:inset 2px 0 0 var(--acc);font-weight:600}td.act{text-align:left}
ul.n{margin:0;padding-left:18px;font-size:12.5px;color:var(--ink2)}ul.n li{margin:3px 0}
.ctlrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
pre.snip{background:var(--bg2);border:1px solid var(--line);border-radius:var(--rs);padding:12px 14px;overflow:auto;font:12px/1.55 var(--mono);white-space:pre;max-height:420px;margin:12px 0 0}
.copyrow{display:flex;gap:8px 10px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-size:13px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:9px;padding:5px 14px;cursor:pointer;min-height:32px}
.foot{margin-top:56px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--ink3);max-width:90ch}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
/* ---------- responsive ---------- */
@media (max-width:1100px){.pcs{grid-template-columns:1fr 1fr}}
@media (max-width:900px){
 .app{display:block}
 .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:14px 16px 10px;gap:10px;display:grid;grid-template-columns:1fr auto;align-items:center}
 .brand{padding:0}.sidefoot{margin:0;display:flex;gap:6px;padding:0;align-items:center}.sidefoot .lbl{display:none}
 #tabs{grid-column:1/-1;flex-direction:row;flex-wrap:nowrap;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}.navh{display:none}
 #tabs button{flex:none;white-space:nowrap;width:auto;border:1px solid var(--line);border-radius:999px;padding:5px 12px;flex-direction:row;gap:6px;align-items:baseline}
 #tabs button[aria-selected=true]{box-shadow:none;border-color:var(--ink)}
 main{padding:22px 16px 64px}
 .bar{margin:18px -16px 0;padding:10px 16px 6px}
 .grid2{grid-template-columns:1fr}
 h1{font-size:27px}
}
@media (max-width:768px),(pointer:coarse){.seg button,.btn,#tabs button{min-height:44px}.seg.sm button{min-height:40px}.mk{min-height:24px}input[type=range]{height:44px}.mk.r1{top:38px}.mk.r2{top:64px}.track{padding-bottom:62px}.slider label,.tval{line-height:44px}}
@media (max-width:640px){.pcs{grid-template-columns:1fr}.wm{font-size:17px}.tag{display:none}}
@media (max-width:520px){
 .gearrow{gap:8px}#gears{display:grid;grid-template-columns:repeat(4,1fr);width:100%}
 #gears button{padding:4px 4px;white-space:normal;line-height:1.25;font-size:12.5px}#gears .sep{display:none}#gears .z{display:block;font-size:11px}
 .slider{grid-template-columns:1fr auto;width:100%}.slider label{grid-row:1}.tval{grid-row:1;grid-column:2}.track{grid-column:1/-1}
 .vot{margin-left:0}.card{padding:14px}.kpi .v{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style></head><body>
<div class="app">
<aside class="side" id="side">
 <div class="brand"><svg viewBox="0 0 26 26" aria-hidden="true"><rect x="1.5" y="1.5" width="23" height="23" rx="6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M7 9h12M7 13h8M7 17h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
  <div><div class="wm">compactlab</div><div class="tag" id="tag"></div></div></div>
 <nav id="tabs" role="tablist" aria-label="Groups"></nav>

 <header>

 </header>

 <h2 id="hImpact"></h2><p class="sub" id="sImpact"></p>
 <div id="fImpact"></div>

 <h2 id="hCopy"></h2>
 <div class="card" id="fCopy"></div>

<script>
const D=JSON.parse(document.getElementById('data').textContent);
const $=s=>document.querySelector(s),NS='http://www.w3.org/2000/svg';
const fk=v=>v==null?'–':v>=1e6?(v/1e6)+'M':Math.round(v/1e3)+'k';
const MINUS='−';
const fd=v=>(v<0?MINUS:'')+'$'+(Math.abs(v)>=100?Math.round(Math.abs(v)).toLocaleString('en-US'):Math.abs(v).toFixed(2));
const fds=v=>(v>=0?'+':MINUS)+'$'+(Math.abs(v)>=100?Math.round(Math.abs(v)).toLocaleString('en-US'):Math.abs(v).toFixed(2));
// per-day money: one decimal below $1,000 ('−$204.8' = saves $204.8)
const fusd=v=>v==null?'–':Math.abs(v)<.05?'$0':(v<0?MINUS:'+')+'$'+(Math.abs(v)<1000?Math.abs(v).toFixed(1):Math.round(Math.abs(v)).toLocaleString('en-US'));
const pc=v=>(v>=0?'+':MINUS)+Math.abs(v*100).toFixed(0)+'%';
const fh=s=>{const a=Math.abs(s),sg=s>=0?'+':MINUS;return a>=3600?sg+(a/3600).toFixed(1)+'h':sg+Math.round(a/60)+'m'};
const fha=s=>s>=3600?(s/3600).toFixed(1)+'h':Math.round(s/60)+'m';
const fm=s=>{const a=Math.abs(s)/60;return (s>=0?'+':MINUS)+(a>=10?Math.round(a):a.toFixed(1))+'m'};
// minutes on a basis; months switch to hours
const fmin=(v,basis)=>{if(v==null)return '–';if(Math.abs(v)<.05)return '0';const sg=v<0?MINUS:'+',a=Math.abs(v);
  if(basis==='per_month'&&a>=120)return sg+(a/60).toFixed(1)+' h';return sg+(a>=100?Math.round(a):a.toFixed(1))+' min'};
const fdays=v=>(+v).toFixed(Math.abs(v-Math.round(v))<.05?0:1);
const day=ts=>new Date(ts*1000).toISOString().slice(0,10);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tone=v=>Math.abs(v)<.05?'':v<0?'good':'warn';
// ---------- i18n: every string in English and Chinese; default shows both ----------
const I={
 tag:['Independent open-source tool','独立开源工具'], lLang:['Language','语言'], lTheme:['Theme','主题'],
 thAuto:['Auto','自动'], thLight:['Light','浅色'], thDark:['Dark','深色'],
 synthetic:['synthetic demo data','合成演示数据'],
 mRange:['History','历史范围'], mSource:['Data source','数据来源'], mMode:['Mode','模式'], mSize:['Sample','样本'],

  b.innerHTML='<p>'+esc(t('dHead',D.deep.model,D.deep.judge_model,D.deep.repeats,fd(D.deep.spent_usd),fd(D.deep.budget_usd)))+(D.deep.stopped?' '+esc(D.deep.stopped):'')+'</p><table><tr><th>'+t('threshold')+'</th><th>'+t('dAssumed')+'</th><th>'+t('dMeasured')+'</th><th>'+t('dSamples')+'</th><th></th></tr>'+hy.points.map(p=>`<tr><td>${fk(p.threshold)}</td><td>${p.assumed_recall==null?'–':p.assumed_recall.toFixed(3)}</td><td>${p.measured_recall.toFixed(3)}</td><td>${p.samples}</td><td>${p.assumed_recall!=null&&Math.abs(p.measured_recall-p.assumed_recall)>.1?'<span class="warn">'+t('dDis')+'</span>':''}</td></tr>`).join('')+'</table>'+Object.entries(hy.adjusted||{}).map(([k,v])=>'<p class="warn">'+t('dLowered',t(k),fk(v))+'</p>').join('')}
function costs(){const g=G(),box=$('#fCost'),sc=SC(g);box.innerHTML='<h3>'+t('coTitle')+'</h3><p>'+tp('coSub')+'</p>';
  const f=frame(460,300,{l:50,r:14,t:12,b:30}),xs=g.grid,hi=Math.max(...sc,SCp(g,g.default))*1.08;
  const X=v=>f.x0+(v-xs[0])/((xs[xs.length-1]-xs[0])||1)*(f.x1-f.x0),Y=v=>f.y0-v/hi*(f.y0-f.y1);
  const P=g.profiles[S.gear];if(P){const r=P.recommendation;f.svg.append(el('rect',{x:X(r.range[0]),y:f.y1,width:Math.max(X(r.range[1])-X(r.range[0]),3),height:f.y0-f.y1,fill:'var(--acc-soft)'}))}
  const st=Math.ceil(xs.length/6);axes(f,X,Y,xs.filter((_,i)=>i%st===0),ticks(0,hi,4),fk,fd);
  const dv=SCp(g,g.default);f.svg.append(el('line',{x1:f.x0,x2:f.x1,y1:Y(dv),y2:Y(dv),stroke:'var(--ink3)','stroke-dasharray':'2 3','stroke-width':.9}));
  line(f,X,Y,xs,g.cost,'var(--ink3)',1.1);line(f,X,Y,xs,g.penalty,'var(--amber)',1.1,'3 3');line(f,X,Y,xs,sc,'var(--acc)',2);
  const si=xs.indexOf(S.T);f.svg.append(el('line',{x1:X(S.T),x2:X(S.T),y1:f.y1,y2:f.y0,stroke:'var(--acc)','stroke-width':1,opacity:.6}));f.svg.append(el('circle',{cx:X(S.T),cy:Y(sc[si]),r:4,fill:'var(--acc)'}));
  const e=xs.length-1,xe=f.x1-2;
  dlabels(f,[{x:xe,y:Y(sc[e])-6,text:t1('lScore'),color:'var(--acc)',bold:1},{x:xe,y:Y(g.cost[e])-6,text:t1('lCost'),color:'var(--ink2)'},{x:xe,y:Y(g.penalty[e])-6,text:t1('lPen'),color:'var(--amber)'},{x:f.x0+4,y:Y(dv)-5,text:t1('lDefault')+' '+fk(g.default.threshold),color:'var(--ink2)',anchor:'start'}]);
  hover(f,byX(f,X,xs));
  box.append(f.svg);box.insertAdjacentHTML('beforeend',leg([['var(--acc-soft)',t('lRange'),1]]))}
function timeChart(){const g=G(),d=g.default,box=$('#fTime'),tm=g.time_model,xs=g.grid;
  const saved=xs.map((_,i)=>d.time_turns_s-g.time_turns_s[i]),added=xs.map((_,i)=>(g.time_compact_s[i]+g.time_redisc_s[i])-(d.time_compact_s+d.time_redisc_s)),net=xs.map((_,i)=>g.time_s[i]-d.time_s);
  box.innerHTML='<h3>'+t('tTitle')+'</h3><p>'+tp('tSub')+'</p>';
  const f=frame(940,260,{l:54,r:14,t:12,b:30}),all=[...saved,...added,...net,0],lo=Math.min(...all),hi=Math.max(...all),pad=(hi-lo||1)*.1;
  const X=v=>f.x0+(v-xs[0])/((xs[xs.length-1]-xs[0])||1)*(f.x1-f.x0),Y=v=>f.y0-(v-(lo-pad))/((hi+pad)-(lo-pad))*(f.y0-f.y1);
  const st=Math.ceil(xs.length/10);axes(f,X,Y,xs.filter((_,i)=>i%st===0),ticks(lo-pad,hi+pad,4),fk,fh);
  f.svg.append(el('line',{x1:f.x0,x2:f.x1,y1:Y(0),y2:Y(0),stroke:'var(--ink3)','stroke-width':.8}));
  line(f,X,Y,xs,saved,'var(--good)',1.1);line(f,X,Y,xs,added,'var(--amber)',1.1);line(f,X,Y,xs,net,'var(--acc)',2);
  f.svg.append(el('line',{x1:X(S.T),x2:X(S.T),y1:f.y1,y2:f.y0,stroke:'var(--acc)','stroke-dasharray':'3 3',opacity:.7}));
  const L=[[saved,'tSaved','var(--good)'],[added,'tAdded','var(--amber)'],[net,'tNet','var(--acc)']].map(([v,k,c])=>{const i=v.reduce((b,x,j)=>Math.abs(x)>Math.abs(v[b])?j:b,0);return {x:Math.min(X(xs[i])+6,f.x1-130),y:Y(v[i])+(v[i]>=0?-6:14),text:t1(k),color:c,anchor:'start',bold:k==='tNet'}});
  dlabels(f,L);
  hover(f,byX(f,X,xs));
  box.append(f.svg);box.insertAdjacentHTML('beforeend','<p class="'+(tm.turn_source==='own'&&tm.compact_source==='own'?'mut':'warn')+'" style="margin:10px 0 0;font-size:12px">'+esc((S.lang==='en'?[0]:S.lang==='zh'?[1]:[0,1]).map(L=>I.tConf[L](I['conf_'+tm.turn_confidence][L],tm.n_turn_samples,I['conf_'+tm.compact_confidence][L],tm.n_compact_samples,I['src_'+(tm.turn_source||'prior')][L],I['src_'+(tm.compact_source||'prior')][L])).join(' · '))+'</p>')}
function hist(){const g=G(),box=$('#fHist'),h=g.hist;box.innerHTML='<h3>'+t('hTitle')+'</h3><p>'+tp('hSub')+'</p>';
  const f=frame(460,300,{l:42,r:14,t:12,b:30}),n=h.turns.length,mx=Math.max(...h.turns,...h.share)*1.15||1,bw=(f.x1-f.x0)/n;
  const Y=v=>f.y0-v/mx*(f.y0-f.y1),X=v=>f.x0+v/(n*h.bin)*(f.x1-f.x0);
  axes(f,X,Y,Array.from({length:Math.min(n,8)+1},(_,i)=>Math.round(i*n/Math.min(n,8))*h.bin),ticks(0,mx,4),fk,v=>Math.round(v*100)+'%');
  h.turns.forEach((v,i)=>f.svg.append(el('rect',{x:f.x0+i*bw+1,y:Y(v),width:Math.max(bw-2,1),height:f.y0-Y(v),fill:'var(--line2)',rx:2})));
  f.svg.append(el('polyline',{points:h.share.map((v,i)=>(f.x0+(i+.5)*bw)+','+Y(v)).join(' '),fill:'none',stroke:'var(--acc)','stroke-width':1.8,'stroke-linejoin':'round'}));
  f.svg.append(el('line',{x1:X(S.T),x2:X(S.T),y1:f.y1,y2:f.y0,stroke:'var(--ink)','stroke-width':1,'stroke-dasharray':'3 3'}));
  const over=h.share.reduce((a,v,i)=>a+((i+1)*h.bin>S.T?v:0),0);
  const ti=h.turns.reduce((b,x,j)=>x>h.turns[b]?j:b,0),ri=h.share.reduce((b,x,j)=>x>h.share[b]?j:b,0);
  dlabels(f,[{x:Math.min(X(S.T)+6,f.x1-150),y:f.y1+10,text:t1('hAbove',Math.round(over*100),fk(S.T)),color:'var(--ink)',anchor:'start'},
    {x:Math.min(f.x0+(ri+.5)*bw+6,f.x1-90),y:Y(h.share[ri])-6,text:t1('hRead'),color:'var(--acc)',anchor:'start',bold:1},
    {x:Math.min(f.x0+(ti+.5)*bw+6,f.x1-90),y:Y(h.turns[ti])-6,text:t1('hTurns'),color:'var(--ink2)',anchor:'start'}]);
  box.append(f.svg)}
function simulate(sess,g,T){const out=[];let c=g.base_tokens,k=0;const pp=g.penalty_params;
  for(const x of sess.growth){c+=x;if(c>T){k++;const d=Math.max(c-g.base_tokens-g.summary_tokens,0);c=g.base_tokens+g.summary_tokens+Math.round(pp.rho*d+pp.fixed_tokens)}out.push(c)}return {out,k}}
function sessList(){const g=G();return D.sessions.filter(s=>s.model===g.model&&s.role===g.role).sort((a,b)=>b.peak-a.peak).slice(0,30)}
function sessPick(){const box=$('#fSess'),ss=sessList();
  const cur=S.sid&&ss.find(s=>s.id===S.sid)?S.sid:(ss[0]||{}).id;S.sid=cur;
  box.innerHTML=`<h3>${t('sTitle')}</h3><p id="sSub"></p><select id="sp" aria-label="${t('colSession')}">${ss.map(s=>`<option value="${esc(s.id)}"${s.id===cur?' selected':''}>${esc(s.id.slice(0,24))} · ${fk(s.peak)} · ${s.turns}</option>`).join('')}</select><div id="sChart"></div>`;
  $('#sp').onchange=e=>{S.sid=e.target.value;sessChart()};sessChart()}
function sessChart(){const g=G(),box=$('#sChart'),s=sessList().find(x=>x.id===S.sid);$('#sSub').innerHTML=tp('sSub',fk(S.T));box.innerHTML='';if(!s)return;
  const sim=simulate(s,g,S.T),n=s.curve.length;
  const f=frame(460,260,{l:42,r:14,t:14,b:26}),hi=Math.max(...s.curve,...sim.out,S.T)*1.1;
  const X=i=>f.x0+i/((n-1)||1)*(f.x1-f.x0),Y=v=>f.y0-v/hi*(f.y0-f.y1);
  axes(f,X,Y,[0,Math.round((n-1)/2),n-1],ticks(0,hi,4),i=>Math.round(i/(n-1||1)*100)+'%',fk);
  f.svg.append(el('line',{x1:f.x0,x2:f.x1,y1:Y(S.T),y2:Y(S.T),stroke:'var(--ink3)','stroke-dasharray':'3 3','stroke-width':.9}));
  f.svg.append(el('polyline',{points:s.curve.map((v,i)=>X(i)+','+Y(v)).join(' '),fill:'none',stroke:'var(--line2)','stroke-width':1.6,'stroke-linejoin':'round'}));
  f.svg.append(el('polyline',{points:sim.out.map((v,i)=>X(i)+','+Y(v)).join(' '),fill:'none',stroke:'var(--acc)','stroke-width':1.6,'stroke-linejoin':'round'}));
  dlabels(f,[{x:f.x0+4,y:Y(S.T)-5,text:t1('threshold')+' '+fk(S.T),color:'var(--ink2)',anchor:'start'},
    {x:f.x1-2,y:Y(s.curve[n-1])-6,text:t1('sAct',s.compactions),color:'var(--ink2)'},{x:f.x1-2,y:Y(sim.out[sim.out.length-1])-6,text:t1('sRep',sim.k),color:'var(--acc)',bold:1}]);
  box.append(f.svg)}
function copyPanel(){const b=$('#fCopy'),R=D.recommendations||[];
  const hs=[...new Set(R.map(r=>r.harness))];if(!hs.length){b.innerHTML='<p class="mut">–</p>';return}
  S.cp=S.cp||{harness:G().harness,scope:'global',profile:G().profile||'balanced',format:null};if(!hs.includes(S.cp.harness))S.cp.harness=hs[0];
  const fmts=[...new Set(R.filter(r=>r.harness===S.cp.harness&&r.scope===S.cp.scope).map(r=>r.format))];if(!fmts.includes(S.cp.format))S.cp.format=fmts[0];
  const seg=(key,vals,lab)=>`<span class="mut">${t(lab)}</span><div class="seg sm" data-k="${key}">${vals.map(v=>`<button data-v="${v}" aria-pressed="${S.cp[key]===v}">${I[v]?t(v):v}</button>`).join('')}</div>`;
  const rows=R.filter(r=>r.harness===S.cp.harness&&r.scope===S.cp.scope&&r.profile===S.cp.profile&&r.format===S.cp.format);
  const snips=rows.filter(r=>!r.omitted),om=rows.filter(r=>r.omitted);
  const txt=snips.map(r=>r.text).join('\n');
  b.innerHTML='<p>'+tp('cpSub')+'</p><div class="copyrow">'+seg('harness',hs,'cpHarness')+seg('scope',['global','project','agent'],'cpScope')+seg('profile',PROF,'cpTier')+seg('format',fmts,'cpFormat')+'</div>'+
    (snips.length?'<div class="copyrow" style="margin-top:12px"><button class="btn" id="cpBtn">'+t('cpCopy')+'</button><span class="mut" id="cpMsg" role="status" aria-live="polite"></span></div><pre class="snip" id="cpPre"></pre>':'')+
    (om.length?'<ul class="n" style="margin-top:12px">'+om.map(o=>'<li>'+(snips.length?'':t('cpNone')+' ')+esc(o.omitted)+'</li>').join('')+'</ul>':'');
  if(snips.length){$('#cpPre').textContent=txt;$('#cpBtn').onclick=()=>copyText(txt)}
  b.querySelectorAll('.seg[data-k]').forEach(sg=>sg.querySelectorAll('button').forEach(bt=>bt.onclick=()=>{S.cp[sg.dataset.k]=bt.dataset.v;if(sg.dataset.k!=='format')S.cp.format=null;keep(copyPanel)}))}
// navigator.clipboard needs a secure context (not file://); fall back to execCommand, then to selecting the text
async function copyText(txt){let ok=false;
  try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(txt);ok=true}}catch(e){}
  if(!ok){try{const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.append(ta);ta.select();ok=document.execCommand('copy');ta.remove()}catch(e){}}
  const msg=$('#cpMsg'),btn=$('#cpBtn');
  if(ok){msg.textContent='✓ '+t('cpCopied');msg.className='good';btn.textContent=t('cpCopied')}
  else{msg.textContent=t('cpFail');msg.className='warn';const r=document.createRange();r.selectNodeContents($('#cpPre'));const sel=getSelection();sel.removeAllRanges();sel.addRange(r)}
  clearTimeout(copyText.tm);copyText.tm=setTimeout(()=>{if($('#cpBtn')){$('#cpBtn').textContent=t('cpCopy');$('#cpMsg').textContent=''}},2200)}

function pick(i){S.gi=i;S.gear=G().profile||'balanced';S.T=G().profiles[S.gear].threshold;S.vot=G().profiles[S.gear].value_of_time;S.sid=null;document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',+b.dataset.tab===i));render()}

addEventListener('scroll',hideTip,{passive:true});
let sortK='peak',asc=false;
function spark(c){if(c.length<2)return'';const w=110,h=20,mx=Math.max(...c);return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"><polyline fill="none" stroke="var(--acc)" stroke-width="1.1" points="${c.map((v,i)=>(i/(c.length-1)*w).toFixed(1)+','+(h-1-v/mx*(h-2)).toFixed(1)).join(' ')}"/></svg>`}
function renderS(){const q=$('#q').value.toLowerCase();const rows=D.sessions.filter(s=>(s.id+s.model+s.role+s.harness).toLowerCase().includes(q));
  rows.sort((a,b)=>(a[sortK]>b[sortK]?1:-1)*(asc?1:-1));$('#cnt').textContent=t('of',rows.length,D.sessions.length);
  const cols=[['id','colSession'],['harness','colHarness'],['role','colRole'],['model','colModel'],['turns','colTurns'],['peak','colPeak'],['compactions','colComp']];
  $('#st').innerHTML='<tr>'+cols.map(c=>`<th data-k="${c[0]}">${t(c[1])}</th>`).join('')+'<th>'+t('colCtx')+'</th></tr>'+rows.slice(0,500).map(s=>`<tr><td>${esc(s.id.slice(0,28))}</td><td>${s.harness}</td><td>${s.role}</td><td>${esc(s.model)}</td><td>${s.turns}</td><td>${fk(s.peak)}</td><td>${s.compactions}</td><td>${spark(s.curve)}</td></tr>`).join('');
  document.querySelectorAll('#st th[data-k]').forEach(th=>th.onclick=()=>{const k=th.dataset.k;asc=sortK===k?!asc:false;sortK=k;renderS()})}
