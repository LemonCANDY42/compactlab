<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>compactlab report</title>
<style>
:root{--bg:#fbfbfa;--fg:#17181a;--mut:#74777c;--bd:#e6e6e3;--card:#fff;--acc:#4f46e5;--acc2:#0f766e;--warn:#b45309;--ghost:#c9cbd0;--band:#4f46e514}
@media (prefers-color-scheme:dark){:root{--bg:#0e0f11;--fg:#ececed;--mut:#8b8e94;--bd:#24262b;--card:#15171a;--acc:#8b93ff;--acc2:#5eead4;--warn:#fbbf24;--ghost:#3a3d44;--band:#8b93ff1a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 -apple-system,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:980px;margin:0 auto;padding:28px 16px 64px}
h1{font-size:22px;font-weight:650;letter-spacing:-.02em;margin:0}h2{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:36px 0 10px}
.mut{color:var(--mut)}.badge{display:inline-block;font-size:11px;border:1px solid var(--bd);border-radius:999px;padding:0 8px;margin-right:4px;color:var(--fg)}code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace}.sub{margin:4px 0 0;font-size:13px}
details.note{margin:14px 0 0;font-size:12.5px;color:var(--mut);border-left:2px solid var(--warn);padding:2px 0 2px 12px}details.note summary{cursor:pointer;color:var(--fg)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:22px 0 0}
.pills button,.seg button{font:inherit;color:var(--mut);background:transparent;border:1px solid var(--bd);border-radius:999px;padding:5px 12px;cursor:pointer;transition:.15s}
.pills button:hover,.seg button:hover{color:var(--fg)}.pills button[aria-selected=true]{color:var(--fg);border-color:var(--fg)}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px 22px;margin-top:14px}
.gearrow{display:flex;flex-wrap:wrap;align-items:center;gap:16px;justify-content:space-between}
.seg{display:inline-flex;gap:2px;background:var(--bg);border:1px solid var(--bd);border-radius:999px;padding:3px}.seg button{border:0;border-radius:999px;padding:6px 16px}
.seg button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.slider{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mut)}input[type=range]{width:220px;accent-color:var(--acc)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px;margin-top:22px}
.kpis .k{font-size:12px;color:var(--mut)}.kpis .v{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.2}.kpis .d{font-size:12px;color:var(--mut)}
.good{color:var(--acc2)}.bad{color:var(--warn)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.fig{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px}.fig h3{font-size:13px;font-weight:600;margin:0 0 2px}.fig p{margin:0 0 8px;font-size:12px;color:var(--mut)}
svg{width:100%;height:auto;display:block}text{fill:var(--mut);font-size:10.5px;font-family:inherit}.tip{font-size:11px}.ax{stroke:var(--bd)}.grid{stroke:var(--bd);stroke-dasharray:1 4}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:6px}.legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:5px}
select,input[type=search]{font:inherit;font-size:13px;background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:5px 9px}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}
th{cursor:pointer;color:var(--mut);font-weight:500}.scroll{overflow:auto;max-height:420px}
ul.n{margin:12px 0 0;padding-left:18px;font-size:12px;color:var(--mut)}
</style></head><body><main>
<h1>compactlab</h1>
<p class="sub mut" id="meta"></p>
<details class="note"><summary>How to read this (assumptions)</summary><p id="caveat"></p></details>
<div class="pills" id="tabs" role="tablist"></div>
<section class="panel" id="ctl"></section>
<h2>Trade-off</h2>
<div class="grid2"><div class="fig" id="fPareto"></div><div class="fig" id="fCost"></div></div>
<h2>Lite vs deep</h2>
<div class="fig" id="fDeep"></div>
<h2>Your history</h2>
<div class="grid2"><div class="fig" id="fHist"></div><div class="fig" id="fSess"></div></div>
<h2>Sessions</h2>
<p><input type="search" id="q" placeholder="Filter sessions"> <span class="mut" id="cnt"></span></p>
<div class="fig scroll"><table id="st"></table></div>
</main>
<script id="data" type="application/json">__DATA__</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const $=s=>document.querySelector(s),NS='http://www.w3.org/2000/svg';
const fk=v=>v>=1e6?(v/1e6)+'M':Math.round(v/1e3)+'k',fd=v=>'$'+(v>=100?Math.round(v).toLocaleString():v.toFixed(2)),pc=v=>(v>=0?'+':'−')+Math.abs(v*100).toFixed(0)+'%';
const esc=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
$('#meta').innerHTML=(D.demo?'<span class="badge">synthetic demo data</span> ':'')+'<span class="badge">'+D.mode+' mode</span> '+esc(D.generated)+' · '+D.groups.length+' model/role groups · '+D.sessions.length+' sessions';
$('#caveat').innerHTML='Costs come from replaying your own history against a price table ('+esc(D.pricing_note)+'). Recall is an <b>assumed</b> proxy (context-rot table × summary retention), not a measured curve for any model; it only acts as a floor. Estimated savings are relative to a replay of your historical behaviour, not to your invoice. Treat the result as a starting point to try.';
function el(t,a,x){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(x!=null)e.textContent=x;return e}
const S={gi:0,gear:'headroom',T:null};
const G=()=>D.groups[S.gi];
function setGear(g){S.gear=g;if(g!=='custom')S.T=G().gears[g];render()}
function frame(W,H,m){const svg=el('svg',{viewBox:`0 0 ${W} ${H}`});return {svg,x0:m.l,x1:W-m.r,y0:H-m.b,y1:m.t}}
function axes(f,X,Y,xt,yt,xf,yf){for(const v of yt){f.svg.append(el('line',{x1:f.x0,x2:f.x1,y1:Y(v),y2:Y(v),class:'grid'}));f.svg.append(el('text',{x:f.x0-6,y:Y(v)+3.5,'text-anchor':'end'},yf(v)))}
  for(const v of xt)f.svg.append(el('text',{x:X(v),y:f.y0+16,'text-anchor':'middle'},xf(v)));f.svg.append(el('line',{x1:f.x0,x2:f.x1,y1:f.y0,y2:f.y0,class:'ax'}))}
const ticks=(lo,hi,n)=>Array.from({length:n+1},(_,i)=>lo+(hi-lo)*i/n);
function controls(){const g=G(),i=g.grid.indexOf(S.T),r=g.recommendation,h=g.history;
  const gears=[['eco','Eco'],['standard','Standard'],['headroom','Headroom'],['recall','Recall'],['custom','Custom']];
  const cost=g.combined[i],hc=h.combined,sv=1-cost/hc,sv0=1-cost/g.baseline_cost_total;
  $('#ctl').innerHTML=`<div class="gearrow"><div class="seg" role="group" aria-label="Gear">${gears.map(([k,l])=>`<button data-g="${k}" aria-pressed="${S.gear===k}">${l}</button>`).join('')}</div>
  <div class="slider"><span>Threshold</span><input type="range" min="0" max="${g.grid.length-1}" value="${i}" id="rng" aria-label="Threshold"><b style="color:var(--fg)">${fk(S.T)}</b></div></div>
  <div class="kpis">
   <div><div class="k">Estimated spend vs. your history</div><div class="v ${sv>=0?'good':'bad'}">${pc(-sv)}</div><div class="d">${fd(cost)} vs ${fd(hc)} (${h.threshold?'median compaction ≈ '+fk(h.threshold):'no compaction observed'})</div></div>
   <div><div class="k">vs. never compacting</div><div class="v ${sv0>=0?'good':'bad'}">${pc(-sv0)}</div><div class="d">${fd(g.baseline_cost_total)}</div></div>
   <div><div class="k">Assumed recall</div><div class="v ${g.recall[i]>=r.recall_floor?'':'bad'}">${g.recall[i].toFixed(3)}</div><div class="d">history ${h.recall.toFixed(3)} · floor ${r.recall_floor}</div></div>
   <div><div class="k">Tiers</div><div class="v">${fk(g.tiers.standard.threshold)} → ${fk(g.tiers.headroom.threshold)}</div><div class="d">standard → headroom: ${pc(g.tiers.headroom.extra_cost_pct)} cost, ${g.tiers.headroom.fewer_compactions} fewer compactions${g.tiers.headroom.lite_threshold?' · deep lowered from '+fk(g.tiers.headroom.lite_threshold):''}</div></div>
   <div><div class="k">Compactions in replay</div><div class="v">${g.compactions[i]}</div><div class="d">${g.n_sessions} sessions · ${g.n_turns.toLocaleString()} turns</div></div></div>
  <ul class="n">${notes(g).map(n=>'<li>'+esc(n)+'</li>').join('')}</ul>`;
  document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>setGear(b.dataset.g));
  $('#rng').oninput=e=>{S.gear='custom';S.T=g.grid[+e.target.value];render()}}
function notes(g){const n=[],pp=g.penalty_params,r=g.recommendation;
  if(!r.floor_met)n.push(r.note);
  if(r.threshold===g.grid[0])n.push('Optimum is at the lowest grid value; widen the grid or revisit the penalty assumptions.');
  n.push(pp.source==='prior'?'Penalty uses a prior ('+pp.n_observed+' observed compactions; ≥5 needed to calibrate).':'Penalty calibrated from '+pp.n_observed+' observed compactions.');
  n.push('Prices: row “'+g.price_key+'” from '+g.price_source+'.');
  n.push('Assumed base '+fk(g.base_tokens)+', summary '+fk(g.summary_tokens)+', window '+fk(g.max_window)+'. Gears: Eco = cheapest Pareto point meeting the floor; Standard = combined-score optimum; Headroom (default) = largest threshold within '+Math.round(g.tiers.headroom.rule.tolerance*100)+'% of the optimum and above the floor; Recall = highest assumed recall.');return n}
function pareto(){const g=G(),box=$('#fPareto');box.innerHTML='<h3>Pareto frontier</h3><p>Each dot is a threshold. Up and to the left is better: cheaper and safer (assumed recall).</p>';
  const f=frame(460,300,{l:48,r:14,t:10,b:30});const xs=g.combined,ys=g.recall;
  let x0=Math.min(...xs,g.history.combined),x1=Math.max(...xs,g.history.combined),y0=Math.min(...ys,g.history.recall),y1=Math.max(...ys,g.history.recall);
  const px=(x1-x0||1)*.06,py=(y1-y0||.01)*.12;x0-=px;x1+=px;y0-=py;y1+=py;
  const X=v=>f.x0+(v-x0)/(x1-x0)*(f.x1-f.x0),Y=v=>f.y0-(v-y0)/(y1-y0)*(f.y0-f.y1);
  axes(f,X,Y,ticks(x0,x1,4),ticks(y0,y1,4),fd,v=>v.toFixed(3));
  const fr=g.gears.pareto.map(t=>g.grid.indexOf(t)).sort((a,b)=>xs[a]-xs[b]);
  f.svg.append(el('line',{x1:f.x0,x2:f.x1,y1:Y(g.recommendation.recall_floor),y2:Y(g.recommendation.recall_floor),stroke:'var(--warn)','stroke-dasharray':'4 4','stroke-width':.8}));
  f.svg.append(el('polyline',{points:fr.map(i=>X(xs[i])+','+Y(ys[i])).join(' '),fill:'none',stroke:'var(--acc)','stroke-width':1.5,opacity:.7}));
  g.grid.forEach((t,i)=>{const on=fr.includes(i);f.svg.append(el('circle',{cx:X(xs[i]),cy:Y(ys[i]),r:on?4:2.6,fill:on?'var(--acc)':'var(--ghost)'}))});
  const hy=deepOf(g);if(hy)hy.points.forEach(p=>{const i=g.grid.indexOf(p.threshold);if(i<0)return;f.svg.append(el('rect',{x:X(xs[i])-3.5,y:Y(p.measured_recall)-3.5,width:7,height:7,fill:'none',stroke:'var(--fg)','stroke-width':1.3}));f.svg.append(el('line',{x1:X(xs[i]),x2:X(xs[i]),y1:Y(ys[i]),y2:Y(p.measured_recall),stroke:'var(--fg)','stroke-dasharray':'2 2','stroke-width':.8}))});
  ['eco','standard','headroom','recall'].forEach(k=>{const i=g.grid.indexOf(g.gears[k]);if(i>=0&&k!==S.gear)f.svg.append(el('circle',{cx:X(xs[i]),cy:Y(ys[i]),r:7,fill:'none',stroke:'var(--mut)','stroke-width':1.2}))});
  const si=g.grid.indexOf(S.T);f.svg.append(el('circle',{cx:X(xs[si]),cy:Y(ys[si]),r:8,fill:'var(--acc2)',opacity:.9}));f.svg.append(el('text',{x:X(xs[si])+11,y:Y(ys[si])-9,style:'fill:var(--fg);font-weight:600'},fk(S.T)));
  f.svg.append(el('rect',{x:X(g.history.combined)-4,y:Y(g.history.recall)-4,width:8,height:8,fill:'var(--warn)'}));f.svg.append(el('text',{x:X(g.history.combined)+8,y:Y(g.history.recall)+14,style:'fill:var(--warn)'},'your history'));
  f.svg.append(el('text',{x:f.x1,y:f.y1+8,'text-anchor':'end'},'x: cost + penalty (USD)'));
  box.append(f.svg);box.insertAdjacentHTML('beforeend','<div class="legend"><span><i style="background:var(--acc)"></i>Pareto-optimal</span><span><i style="background:var(--ghost)"></i>dominated</span><span><i style="background:var(--acc2)"></i>selected</span><span>○ other gears</span><span><i style="background:var(--warn)"></i>your history / floor</span>'+(deepOf(g)?'<span><i style="background:var(--fg)"></i>deep: measured recall</span>':'')+'</div>')}
function deepOf(g){return D.deep&&D.deep.groups.find(x=>x.model===g.model&&x.role===g.role)}
function deepPanel(){const g=G(),b=$('#fDeep'),hy=deepOf(g);if(!D.deep){b.innerHTML='<h3>Lite vs deep</h3><p>This report is <b>lite</b> only: recall is an assumed proxy. Run <code>compactlab simulate --mode deep --budget N</code> to measure recall at candidate thresholds (costs money; estimate shown first).</p>';return}
  if(!hy){b.innerHTML='<h3>Lite vs deep</h3><p>No deep samples for this group.</p>';return}
  b.innerHTML='<h3>Lite vs deep</h3><p>'+esc(D.deep.model)+' summarizes, '+esc(D.deep.judge_model)+' judges ('+D.deep.repeats+' votes). Spent '+fd(D.deep.spent_usd)+' of '+fd(D.deep.budget_usd)+'.'+(D.deep.stopped?' Stopped early: '+esc(D.deep.stopped):'')+'</p><table><tr><th>threshold</th><th>assumed (lite)</th><th>measured (deep)</th><th>samples</th><th></th></tr>'+hy.points.map(p=>`<tr><td>${fk(p.threshold)}</td><td>${p.assumed_recall==null?'–':p.assumed_recall.toFixed(3)}</td><td>${p.measured_recall.toFixed(3)}</td><td>${p.samples}</td><td>${p.assumed_recall!=null&&Math.abs(p.measured_recall-p.assumed_recall)>.1?'<span class="bad">disagree</span>':''}</td></tr>`).join('')+'</table>'+(hy.headroom_adjusted_to?'<p class="bad">Measured recall at the lite headroom fell below the floor; headroom lowered to '+fk(hy.headroom_adjusted_to)+'.</p>':'')}
function costs(){const g=G(),box=$('#fCost');box.innerHTML='<h3>Cost by threshold</h3><p>Replay cost, re-discovery penalty and their sum.</p>';
  const f=frame(460,300,{l:48,r:14,t:10,b:30}),xs=g.grid,hi=Math.max(...g.combined)*1.06;
  const X=v=>f.x0+(v-xs[0])/((xs[xs.length-1]-xs[0])||1)*(f.x1-f.x0),Y=v=>f.y0-v/hi*(f.y0-f.y1);
  const r=g.recommendation;f.svg.append(el('rect',{x:X(r.range[0]),y:f.y1,width:Math.max(X(r.range[1])-X(r.range[0]),3),height:f.y0-f.y1,fill:'var(--band)'}));
  const st=Math.ceil(xs.length/6);axes(f,X,Y,xs.filter((_,i)=>i%st===0),ticks(0,hi,4),fk,fd);
  const line=(v,c,w,d)=>f.svg.append(el('polyline',{points:xs.map((t,i)=>X(t)+','+Y(v[i])).join(' '),fill:'none',stroke:c,'stroke-width':w,'stroke-dasharray':d||''}));
  line(g.cost,'var(--ghost)',1.5);line(g.penalty,'var(--warn)',1.2,'3 3');line(g.combined,'var(--acc)',2.2);
  const si=xs.indexOf(S.T);f.svg.append(el('line',{x1:X(S.T),x2:X(S.T),y1:f.y1,y2:f.y0,stroke:'var(--acc2)','stroke-width':1.5}));f.svg.append(el('circle',{cx:X(S.T),cy:Y(g.combined[si]),r:4,fill:'var(--acc2)'}));
  box.append(f.svg);box.insertAdjacentHTML('beforeend','<div class="legend"><span><i style="background:var(--ghost)"></i>cost</span><span><i style="background:var(--warn)"></i>penalty</span><span><i style="background:var(--acc)"></i>combined</span><span><i style="background:var(--band);height:8px"></i>recommended range</span></div>')}
function hist(){const g=G(),box=$('#fHist'),h=g.hist;box.innerHTML='<h3>Where your tokens sit</h3><p>Share of turns and of read tokens by context size. Bars to the right of the line are what a lower threshold would cut.</p>';
  const f=frame(460,300,{l:40,r:14,t:10,b:30}),n=h.turns.length,mx=Math.max(...h.turns,...h.share)*1.1||1,bw=(f.x1-f.x0)/n;
  const Y=v=>f.y0-v/mx*(f.y0-f.y1),X=v=>f.x0+v/(n*h.bin)*(f.x1-f.x0);
  axes(f,X,Y,Array.from({length:Math.min(n,8)+1},(_,i)=>Math.round(i*n/Math.min(n,8))*h.bin),ticks(0,mx,4),fk,v=>Math.round(v*100)+'%');
  h.turns.forEach((v,i)=>f.svg.append(el('rect',{x:f.x0+i*bw+1,y:Y(v),width:bw-2,height:f.y0-Y(v),fill:'var(--ghost)',rx:2})));
  f.svg.append(el('polyline',{points:h.share.map((v,i)=>(f.x0+(i+.5)*bw)+','+Y(v)).join(' '),fill:'none',stroke:'var(--acc)','stroke-width':1.8}));
  f.svg.append(el('line',{x1:X(S.T),x2:X(S.T),y1:f.y1,y2:f.y0,stroke:'var(--acc2)','stroke-width':1.5,'stroke-dasharray':'4 3'}));
  const over=h.share.reduce((a,v,i)=>a+((i+1)*h.bin>S.T?v:0),0);
  f.svg.append(el('text',{x:Math.min(X(S.T)+6,f.x1-130),y:f.y1+10,style:'fill:var(--acc2)'},Math.round(over*100)+'% of read tokens above '+fk(S.T)));
  box.append(f.svg);box.insertAdjacentHTML('beforeend','<div class="legend"><span><i style="background:var(--ghost);height:8px"></i>share of turns</span><span><i style="background:var(--acc)"></i>share of read tokens</span></div>')}
function simulate(sess,g,T){const out=[];let c=g.base_tokens,k=0;const pp=g.penalty_params;
  for(const x of sess.growth){c+=x;if(c>T){k++;const d=Math.max(c-g.base_tokens-g.summary_tokens,0);c=g.base_tokens+g.summary_tokens+Math.round(pp.rho*d+pp.fixed_tokens)}out.push(c)}return {out,k}}
function sessPick(){const g=G(),box=$('#fSess'),ss=D.sessions.filter(s=>s.model===g.model&&s.role===g.role).sort((a,b)=>b.peak-a.peak).slice(0,30);
  const cur=S.sid&&ss.find(s=>s.id===S.sid)?S.sid:(ss[0]||{}).id;S.sid=cur;
  box.innerHTML=`<h3>History vs. estimate</h3><p>Actual context (grey) and the same session replayed at ${fk(S.T)} (colour).</p><select id="sp">${ss.map(s=>`<option value="${esc(s.id)}"${s.id===cur?' selected':''}>${esc(s.id.slice(0,24))} · peak ${fk(s.peak)} · ${s.turns} turns</option>`).join('')}</select>`;
  const s=ss.find(x=>x.id===cur);if(!s)return;const sim=simulate(s,g,S.T),n=s.curve.length;
  const f=frame(460,260,{l:40,r:14,t:10,b:26}),hi=Math.max(...s.curve,...sim.out,S.T)*1.06;
  const X=i=>f.x0+i/((n-1)||1)*(f.x1-f.x0),Y=v=>f.y0-v/hi*(f.y0-f.y1);
  axes(f,X,Y,[0,Math.round((n-1)/2),n-1],ticks(0,hi,4),i=>'t'+Math.round(i/(n-1||1)*100)+'%',fk);
  f.svg.append(el('line',{x1:f.x0,x2:f.x1,y1:Y(S.T),y2:Y(S.T),stroke:'var(--acc2)','stroke-dasharray':'4 3','stroke-width':1}));
  f.svg.append(el('polyline',{points:s.curve.map((v,i)=>X(i)+','+Y(v)).join(' '),fill:'none',stroke:'var(--ghost)','stroke-width':1.8}));
  f.svg.append(el('polyline',{points:sim.out.map((v,i)=>X(i)+','+Y(v)).join(' '),fill:'none',stroke:'var(--acc)','stroke-width':1.6}));
  box.append(f.svg);box.insertAdjacentHTML('beforeend',`<div class="legend"><span><i style="background:var(--ghost)"></i>actual (${s.compactions} compactions)</span><span><i style="background:var(--acc)"></i>replayed (${sim.k} compactions)</span><span><i style="background:var(--acc2)"></i>threshold</span></div>`);
  $('#sp').onchange=e=>{S.sid=e.target.value;sessPick()}}
function render(){controls();pareto();costs();hist();sessPick();deepPanel()}
function pick(i){S.gi=i;S.gear='headroom';S.T=G().gears.headroom;S.sid=null;document.querySelectorAll('#tabs button').forEach((b,j)=>b.setAttribute('aria-selected',j===i));render()}
D.groups.forEach(g=>{g.baseline_cost_total=g.baseline_cost+0});
D.groups.forEach((g,i)=>{const b=document.createElement('button');b.setAttribute('role','tab');b.textContent=g.model+' · '+g.role;b.onclick=()=>pick(i);$('#tabs').append(b)});
if(D.groups.length)pick(0);else $('#ctl').textContent='No sessions found.';
let sortK='peak',asc=false;
function spark(c){if(c.length<2)return'';const w=110,h=20,mx=Math.max(...c);return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"><polyline fill="none" stroke="var(--acc)" stroke-width="1.1" points="${c.map((v,i)=>(i/(c.length-1)*w).toFixed(1)+','+(h-1-v/mx*(h-2)).toFixed(1)).join(' ')}"/></svg>`}
function renderS(){const q=$('#q').value.toLowerCase();const rows=D.sessions.filter(s=>(s.id+s.model+s.role+s.harness).toLowerCase().includes(q));
  rows.sort((a,b)=>(a[sortK]>b[sortK]?1:-1)*(asc?1:-1));$('#cnt').textContent=rows.length+' of '+D.sessions.length;
  const cols=[['id','session'],['harness','harness'],['role','role'],['model','model'],['turns','turns'],['peak','peak'],['compactions','compactions']];
  $('#st').innerHTML='<tr>'+cols.map(c=>`<th data-k="${c[0]}">${c[1]}</th>`).join('')+'<th>context</th></tr>'+rows.slice(0,500).map(s=>`<tr><td>${esc(s.id.slice(0,28))}</td><td>${s.harness}</td><td>${s.role}</td><td>${esc(s.model)}</td><td>${s.turns}</td><td>${fk(s.peak)}</td><td>${s.compactions}</td><td>${spark(s.curve)}</td></tr>`).join('');
  document.querySelectorAll('#st th[data-k]').forEach(th=>th.onclick=()=>{const k=th.dataset.k;asc=sortK===k?!asc:false;sortK=k;renderS()})}
$('#q').oninput=renderS;renderS();
</script></body></html>
